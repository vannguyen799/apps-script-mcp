name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Real PostgreSQL for the storage adapter tests (they are skipped when TEST_DATABASE_URL is not set).
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: asmcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d asmcp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apps Script tests
        working-directory: apps-script
        run: npm test
      - name: Apps Script single-file bundle is up to date and passes the suite
        working-directory: apps-script
        run: |
          npm run test:bundle
          git diff --exit-code -- Code.gs || { echo "::error::apps-script/Code.gs is stale - run 'npm run bundle' and commit it"; exit 1; }
      - name: Server build + tests
        working-directory: server
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/asmcp_test
        run: |
          npm ci
          npm run build
          npm test
