name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apps Script tests
        working-directory: apps-script
        run: npm test
      - name: Server build + tests
        working-directory: server
        run: |
          npm ci
          npm run build
          npm test
