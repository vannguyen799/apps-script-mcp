name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apps Script tests
        working-directory: apps-script
        run: npm test
      - name: Apps Script single-file bundle is up to date and passes the suite
        working-directory: apps-script
        run: |
          npm run test:bundle
          git diff --exit-code -- Code.gs || { echo "::error::apps-script/Code.gs is stale - run 'npm run bundle' and commit it"; exit 1; }
      - name: Server build + tests
        working-directory: server
        run: |
          npm ci
          npm run build
          npm test
