name: Docker image

# main       -> ghcr.io/<owner>/apps-script-mcp:edge
# tag v1.2.3 -> ghcr.io/<owner>/apps-script-mcp:1.2.3, :1.2, :latest
# Also pushed to Docker Hub (<user>/apps-script-mcp, searchable in Docker Desktop) when the repo secrets
# DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are set; without them only GHCR is published.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/apps-script-mcp
            name=docker.io/${{ env.DOCKERHUB_USERNAME }}/apps-script-mcp,enable=${{ env.DOCKERHUB_USERNAME != '' }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Sync Docker Hub description
        if: env.DOCKERHUB_USERNAME != '' && github.ref == 'refs/heads/main'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_USERNAME }}/apps-script-mcp
          short-description: Let Claude read and write Google Sheets via your own Apps Script. No Google Cloud setup.
          readme-filepath: docs/DOCKERHUB.md
