services:
  apps-script-mcp:
    # Prebuilt multi-arch image from GHCR (edge = main branch, x.y.z / latest = releases).
    # Building from source instead: docker compose up -d --build
    image: ghcr.io/vannguyen799/apps-script-mcp:${ASMCP_TAG:-edge}
    build:
      context: .
      dockerfile: server/Dockerfile
    pull_policy: missing
    container_name: apps-script-mcp
    restart: unless-stopped
    ports:
      - "8787:8787"              # public app (/mcp, OAuth, /healthz): the only port a tunnel may target
      - "127.0.0.1:8788:8788"    # admin UI: loopback only, never publish this publicly
    volumes:
      - asmcp-data:/data
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      # Optional PostgreSQL instead of the JSON file in /data (start it with:  docker compose --profile postgres up -d).
      # One server instance per database. The first start imports an existing /data/state.json once.
      # DATABASE_URL: postgres://asmcp:${POSTGRES_PASSWORD:-change-me}@postgres:5432/asmcp
      # Built-in tunnel (no extra service). Put these in .env instead; see .env.example.
      # TUNNEL: ngrok                         # off | cloudflare | ngrok
      # NGROK_AUTHTOKEN: ...
      # NGROK_DOMAIN: my-name.ngrok-free.app  # free static domain = stable URL

  # Optional PostgreSQL for the server state (profile "postgres"). Not published on the host: only the compose network reaches it.
  # Set POSTGRES_PASSWORD in .env, and uncomment DATABASE_URL above (or put it in .env).
  postgres:
    image: postgres:17-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: asmcp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: asmcp
    volumes:
      - asmcp-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asmcp -d asmcp"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  asmcp-data:
  asmcp-pg:
